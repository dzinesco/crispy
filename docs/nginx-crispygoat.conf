# Replace the current Astro proxy at /etc/nginx/sites-available/crispygoat
# with this vhost. Serves the React SPA from /home/tyler/crispy/dist and
# proxies /api/* to the Express API on :3102 (managed by PM2 as `crispy-api`).

# Portfolio card screenshots: serve the matching 1280x800 AVIF/WebP variant
# (same image, ~90% smaller) when the browser accepts it; PNG otherwise.
# Variants are required per PORTFOLIO.md (<slug>-1280.avif/.webp next to <slug>.png).
map $http_accept $cg_img_avif { default ""; "~*image/avif" "-1280.avif"; }
map $http_accept $cg_img_webp { default ""; "~*image/webp" "-1280.webp"; }

server {
    listen 80;
    server_name crispygoat.com www.crispygoat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crispygoat.com www.crispygoat.com;

    ssl_certificate     /etc/letsencrypt/live/crispygoat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crispygoat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/tyler/crispy/dist;
    index index.html;

    # Existing Farm Stand demo (separate Node process)
    location /demo/farm-stand-kit/ {
        proxy_pass http://127.0.0.1:3126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GeoGoated (Next.js, PM2 geogoated on :3140)
    location /geogoated {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static demos under /demo/ — 404 if missing (do not SPA-fallback index.html)
    location /demo/ {
        try_files $uri $uri/ =404;
    }

    # Old "Apps" path — nav uses /portfolio; keep a real redirect instead of SPA 404
    location = /apps { return 301 /portfolio; }
    location = /apps/ { return 301 /portfolio; }

    # React Router client-side routes — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Express
    location /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portfolio screenshots: negotiate AVIF/WebP, cache for a day
    location ~ "^/images/portfolio/(?<cg_slug>[a-z0-9-]+)\.png$" {
        expires 1d;
        add_header Vary Accept;
        try_files /images/portfolio/$cg_slug$cg_img_avif /images/portfolio/$cg_slug$cg_img_webp $uri =404;
    }

    # Other images (blog covers etc.): cache for a day
    location /images/ {
        expires 1d;
        try_files $uri =404;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
