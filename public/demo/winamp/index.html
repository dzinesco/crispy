<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/demo/winamp/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Winamp 2 — Web Edition. The classic 90s MP3 player, recreated in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Crect x='2' y='4' width='12' height='2' fill='%236fff38'/%3E%3Crect x='2' y='7' width='12' height='2' fill='%2339b300'/%3E%3Crect x='2' y='10' width='12' height='2' fill='%231f5e00'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <title>Winamp 2 — Web Edition</title>
  </head>
  <body>
    <div class="desktop" id="desktop">
      <!-- ===================== MAIN WINDOW (275x116) ===================== -->
      <div class="win win-player" data-window="player">
        <div class="titlebar" data-drag>
          <span class="tb-icon"></span>
          <span class="tb-stripes"></span>
          <span class="title-text">WINAMP</span>
          <span class="tb-stripes"></span>
          <div class="title-buttons">
            <button class="btn-title min" data-action="minimize" title="Minimize"></button>
            <button class="btn-title shade" data-action="minimize" title="Windowshade"></button>
            <button class="btn-title close" data-action="close" title="Close"></button>
          </div>
        </div>

        <div class="player-body">
          <div class="clutterbar" aria-hidden="true"><i>O</i><i>A</i><i>I</i><i>D</i><i>V</i></div>
          <div class="lcd">
            <span class="play-status" aria-hidden="true"></span>
            <div class="lcd-time" id="lcd-time">00:00</div>
            <canvas class="spectrum" id="spectrum" width="76" height="16"></canvas>
          </div>
          <div class="lcd-title">
            <span id="lcd-title-text">Drop or add tracks to play...</span>
          </div>
          <div class="lcd-info">
            <span class="info-box"><span class="lcd-bitrate" id="lcd-bitrate">---</span></span><span class="lcd-unit">kbps</span>
            <span class="info-box sr"><span class="lcd-sr" id="lcd-sr">--</span></span><span class="lcd-unit">khz</span>
            <span class="mono-ind">mono</span>
            <span class="lcd-mode" id="lcd-mode">----</span>
          </div>

          <div class="vol" title="Volume">
            <div class="vol-track" id="vol-track">
              <div class="vol-fill" id="vol-fill"></div>
              <div class="vol-knob" id="vol-knob"></div>
            </div>
          </div>
          <div class="bal" title="Balance">
            <div class="bal-track" id="bal-track">
              <div class="bal-fill" id="bal-fill"></div>
              <div class="bal-knob" id="bal-knob"></div>
            </div>
          </div>
          <button class="tgl-btn eq-btn" data-action="toggle-eq" title="Equalizer (E)">EQ</button>
          <button class="tgl-btn pl-btn" data-action="toggle-pl" title="Playlist (L)">PL</button>

          <div class="pos" title="Seek">
            <div class="pos-track" id="pos-track"><div class="pos-knob" id="pos-knob"></div></div>
          </div>

          <div class="transport">
            <button class="t-btn t-prev" data-action="prev" title="Previous (Z)">PREV</button>
            <button class="t-btn t-play" data-action="play" title="Play (X)">PLAY</button>
            <button class="t-btn t-pause" data-action="pause" title="Pause (C)">PAUSE</button>
            <button class="t-btn t-stop" data-action="stop" title="Stop (V)">STOP</button>
            <button class="t-btn t-next" data-action="next" title="Next (B)">NEXT</button>
            <button class="t-btn t-eject" data-action="eject" title="Open files">EJECT</button>
          </div>
          <button class="tgl-btn shuffle" data-action="shuffle" title="Shuffle">SHUFFLE</button>
          <button class="tgl-btn repeat" data-action="repeat" title="Repeat"><span class="rep-arrow"></span></button>
          <span class="wa-logo" aria-hidden="true"></span>
        </div>
      </div>

      <!-- ===================== EQUALIZER (275x116) ===================== -->
      <div class="win win-eq" data-window="eq" hidden>
        <div class="titlebar" data-drag>
          <span class="tb-stripes"></span>
          <span class="title-text">WINAMP EQUALIZER</span>
          <span class="tb-stripes"></span>
          <div class="title-buttons">
            <button class="btn-title close" data-action="close" title="Close"></button>
          </div>
        </div>
        <div class="eq-body">
          <button class="eq-toggle on" data-action="eq-toggle" title="Equalizer on/off">ON</button>
          <button class="eq-auto" data-action="eq-auto" title="Auto">AUTO</button>
          <div class="eq-presets">
            <button class="eq-preset-btn active" data-preset="flat">FLAT</button>
            <button class="eq-preset-btn" data-preset="rock">ROCK</button>
            <button class="eq-preset-btn" data-preset="bass">BASS</button>
            <button class="eq-preset-btn" data-preset="treble">TREB</button>
          </div>
          <span class="eq-preamp-label">PREAMP</span>
          <div class="eq-fader-track preamp" id="preamp-track" title="Preamp">
            <div class="eq-fader-knob" id="preamp-knob"></div>
          </div>
          <span class="eq-preamp-val" id="preamp-val">+0.0 dB</span>
          <div class="eq-db" aria-hidden="true"><span>+12db</span><span>+0db</span><span>-12db</span></div>
          <div class="eq-bands" id="eq-bands"></div>
          <div class="eq-labels" id="eq-labels"></div>
        </div>
      </div>

      <!-- ===================== PLAYLIST ===================== -->
      <div class="win win-pl" data-window="playlist" hidden>
        <div class="titlebar" data-drag>
          <span class="tb-stripes"></span>
          <span class="title-text">WINAMP PLAYLIST</span>
          <span class="tb-stripes"></span>
          <div class="title-buttons">
            <button class="btn-title close" data-action="close" title="Close"></button>
          </div>
        </div>
        <div class="pl-list-wrap">
          <div class="pl-list" id="pl-list" tabindex="0" role="listbox" aria-label="Playlist"></div>
          <div class="pl-empty" id="pl-empty">Drop audio files here, or click ADD</div>
        </div>
        <div class="pl-toolbar">
          <button data-action="pl-add" title="Add files">ADD</button>
          <button data-action="pl-remove" title="Remove selected">REM</button>
          <button data-action="pl-select-all" title="Select all">SEL</button>
          <button data-action="pl-clear" title="Clear list">CLR</button>
          <span class="pl-len" id="pl-len">0 files · 00:00</span>
        </div>
      </div>
    </div>

    <input type="file" id="file-input" multiple accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.opus" hidden />

    <script src="app.js"></script>
  </body>
</html>
