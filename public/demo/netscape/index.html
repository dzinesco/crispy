<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netscape Navigator 3 — Crispy Goat</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #d4d4d8;
        color: #101014;
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      a:link { color: #9f1239; }
      a:visited { color: #86104e; }
      a:focus-visible { outline: 2px solid #9f1239; outline-offset: 3px; }
      .window {
        max-width: 640px;
        margin: 32px auto;
        background: #f4f4f5;
        border: 2px solid #fff;
        border-right-color: #3f3f46;
        border-bottom-color: #3f3f46;
      }
      .title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 8px 12px;
        background: #101014;
        color: #fff;
        font-weight: 600;
      }
      .title a { color: #fff; }
      .title a:visited { color: #ff8ad4; }
      .body { padding: 24px 20px 32px; }
      h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
      p { margin: 0 0 12px; max-width: 42rem; }
      .meta { color: #3f3f46; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="window">
      <div class="title">
        <span>Netscape</span>
        <a href="/">Back to Crispy Goat</a>
      </div>
      <div class="body">
        <h1>Best viewed in Netscape Navigator 3</h1>
        <p>This is the page the button on the homepage points at. The badge is a joke with a real address.</p>
        <p class="meta">800×600 was the old promise. This page is fine at the size you have.</p>
      </div>
    </main>
  </body>
</html>
